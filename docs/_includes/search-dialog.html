<div class="search-dialog" data-search-dialog hidden>
  <div class="search-backdrop" data-search-close></div>
  <section class="search-panel" role="dialog" aria-modal="true" aria-labelledby="search-title">
    <header><h2 id="search-title">搜索文章</h2><button type="button" data-search-close aria-label="关闭搜索">×</button></header>
    <label class="search-field"><span class="sr-only">关键词</span><input type="search" data-search-input placeholder="输入标题、摘要、分类或标签" autocomplete="off"></label>
    <p class="search-status" data-search-status>输入关键词开始搜索。</p>
    <ol class="search-results" data-search-results></ol>
  </section>
</div>
